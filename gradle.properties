#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Increment both for every distributed build, including alpha, beta, RC, and stable releases.
laninbox.androidVersionCode=2
laninbox.windowsBuild=1

# Detach Hot Reload tools to prevent window snapping from interrupting native dragging.
compose.reload.devToolsDetached=true

# Use the WiX version provided by the Windows build environment.
compose.desktop.application.downloadWix=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
