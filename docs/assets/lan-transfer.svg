<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title description">
  <title id="title">LanInbox transfer example</title>
  <desc id="description">An Android phone sends a link to a Windows PC. The PC sends a photo back over HTTPS on the local network.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#edf8f4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="24" fill="url(#background)"/>
  <g fill="#fff" stroke="#cfdaea">
    <rect x="34" y="35" width="200" height="230" rx="20"/>
    <rect x="666" y="35" width="200" height="230" rx="20"/>
  </g>
  <g fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="99" y="68" width="70" height="122" rx="13" fill="#eaf2fe"/>
    <path d="M125 80h18m-16 98h14"/>
    <rect x="113" y="101" width="42" height="55" rx="7" fill="#fff" stroke="none"/>
    <path d="M123 117h22m-22 11h16m-16 11h10" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#1d4e89" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="707" y="84" width="118" height="79" rx="9" fill="#eaf2fe"/>
    <path d="M766 163v21m-24 0h48"/>
    <rect x="725" y="102" width="82" height="42" rx="7" fill="#fff" stroke="none"/>
    <path d="M739 117h53m-53 12h36" stroke-width="3"/>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 106h384m-12-9 12 9-12 9" stroke="#265fac"/>
    <path d="M642 194H258m12-9-12 9 12 9" stroke="#147257"/>
  </g>
  <rect x="329" y="51" width="242" height="39" rx="19.5" fill="#dceaff"/>
  <rect x="357" y="212" width="186" height="39" rx="19.5" fill="#d6f0e5"/>
  <rect x="381" y="131" width="138" height="38" rx="19" fill="#fff" stroke="#cfdaea"/>
  <g fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="404" y="148" width="14" height="11" rx="2"/>
    <path d="M407 148v-3a4 4 0 0 1 8 0v3"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="#14283e" font-size="25" font-weight="700">
      <text x="134" y="230">Android</text>
      <text x="766" y="230">Windows</text>
    </g>
    <text x="450" y="76" fill="#194579" font-size="18">https://example.com</text>
    <text x="450" y="237" fill="#125841" font-size="18">photo.png</text>
    <text x="465" y="157" fill="#334155" font-size="17" font-weight="600">HTTPS</text>
  </g>
</svg>
